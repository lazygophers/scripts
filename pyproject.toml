[project]
name = "scripts"
version = "0.1.0"
description = "脚本工具集：版本控制、构建检查、进程管理、系统通知"
requires-python = ">=3.9"
# fire=CLI 框架(fire_base 顶层 import), rich=强制输出(ui.py 缺席即报错),
# pyyaml=配置读写(archery/graphwatch), requests=HTTP(archery/grafana)
# 下界跟到 2026-09-10 的最新版, 但保持 requires-python >=3.9 装得上;
# 只在 extras 里出现的包(graphifyy/playwright)才要求 3.10+。
dependencies = ["fire>=0.7.1", "rich>=15.0.0", "pyyaml>=6.0.3", "requests>=2.32"]

# 每个命令一个 console_scripts 入口, 指向 lib/cli/<name>.py 里的函数。
# bin/<name> 只是同一个函数的薄壳(clone 后可直接跑), 实现只有 lib/ 一份。
# 装好后可远程执行: uvx --from git+https://github.com/lazygophers/scripts <命令名>
[project.scripts]
# uvx 不带命令名时(`uvx git+https://github.com/lazygophers/scripts`)找的是与包同名的
# 可执行文件, 所以 `scripts` 是 lazyhelp 的别名: 直接列出全部工具。
scripts = "lib.cli.lazyhelp:main"
archery = "lib.cli.archery:main"
check_ai = "lib.cli.check_ai:main"
checkwork = "lib.cli.checkwork:main"
cicd = "lib.cli.cicd:main"
commit = "lib.cli.commit:main"
cpd = "lib.cli.cpd:main"
delete_branch = "lib.cli.delete_branch:main"
delete_branch_remote = "lib.cli.delete_branch_remote:main"
disable-ipv6 = "lib.cli.ipv6:disable_ipv6"
email = "lib.cli.email:main"
enable-ipv6 = "lib.cli.ipv6:enable_ipv6"
fetch_all = "lib.cli.fetch_all:main"
grafana = "lib.cli.grafana:main"
graphwatch = "lib.cli.graphwatch:main"
inject = "lib.cli.inject:main"
ipinfo = "lib.cli.ipinfo:main"
issue = "lib.cli.issue:main"
kk = "lib.cli.kk:main"
kkp = "lib.cli.kkp:main"
lazyhelp = "lib.cli.lazyhelp:main"
list_branch = "lib.cli.list_branch:main"
loop = "lib.cli.loop:main"
merge_branch = "lib.cli.gitwf:merge_branch"
merge_canary = "lib.cli.gitwf:merge_canary"
merge_dev = "lib.cli.gitwf:merge_dev"
merge_develop = "lib.cli.gitwf:merge_develop"
merge_master = "lib.cli.gitwf:merge_master"
merge_test = "lib.cli.gitwf:merge_test"
mr = "lib.cli.mr:main"
n = "lib.cli.n:main"
ovpn = "lib.cli.ovpn:main"
push_branch = "lib.cli.gitwf:push_branch"
push_canary = "lib.cli.gitwf:push_canary"
push_dev = "lib.cli.gitwf:push_dev"
push_develop = "lib.cli.gitwf:push_develop"
push_master = "lib.cli.gitwf:push_master"
push_test = "lib.cli.gitwf:push_test"
squash_pr = "lib.cli.squash_pr:main"
switch_branch = "lib.cli.switch_branch:main"
sync_branch = "lib.cli.sync_branch:main"
sync_master = "lib.cli.sync_master:main"
unsleep = "lib.cli.unsleep:main"
vpn-prio = "lib.cli.vpn_prio:main"
webgrab = "lib.cli.webgrab:main"
websearch = "lib.cli.websearch:main"

[project.optional-dependencies]
# graphwatch 监听需要 graphify（PyPI 包名 graphifyy）+ 其硬依赖 watchdog，默认不装
graphify = ["graphifyy[all]>=0.9.57", "watchdog>=6"]
# webgrab / websearch 抓网页要的四件套，默认不装；playwright 装完还要 `playwright install chromium`
web = ["curl-cffi>=0.16.3", "beautifulsoup4>=4.15.0", "markdownify>=1.2.3", "playwright>=1.62"]
all = [
    "graphifyy[all]>=0.9.57", "watchdog>=6",
    "curl-cffi>=0.16.3", "beautifulsoup4>=4.15.0", "markdownify>=1.2.3", "playwright>=1.62",
]
dev = ["fire>=0.7.1", "rich>=15.0.0", "pyyaml>=6.0.3", "requests>=2.32"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lib", "lib.cli"]

[tool.setuptools.package-dir]
lib = "lib"

[tool.ruff]
line-length = 120
target-version = "py39"
# .trellis / .codex 是外部工具链(trellis 框架 / codex hooks), 非本仓 scripts 项目代码,
# 各自有不同编码规范, 不纳入本仓 ruff 扫描 (checkwork / 日常 lint 均受益)
extend-exclude = [".trellis", ".codex"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]  # 行长由 line-length 控制, 不强制断行
