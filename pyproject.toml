[project]
name = "scripts"
version = "0.1.0"
description = "脚本工具集：版本控制、构建检查、进程管理、系统通知"
requires-python = ">=3.9"
# fire=CLI 框架(fire_base 顶层 import), rich=强制输出(ui.py 缺席即报错),
# pyyaml=配置读写(archery/graphwatch)
dependencies = ["fire>=0.5", "rich>=13.0", "pyyaml>=6"]

[project.optional-dependencies]
# graphwatch 监听需要 graphify（PyPI 包名 graphifyy）+ 其硬依赖 watchdog，默认不装
graphify = ["graphifyy>=0.9.55", "watchdog>=4"]
all = ["graphifyy>=0.9.55", "watchdog>=4"]
dev = ["fire>=0.5", "rich>=13.0", "pyyaml>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lib"]

[tool.setuptools.package-dir]
lib = "lib"

# scripts 入口由 bin/ 下的可执行文件提供, 不走 console_scripts (保留 shebang 直执行模式)
[tool.ruff]
line-length = 120
target-version = "py39"
# .trellis / .codex 是外部工具链(trellis 框架 / codex hooks), 非本仓 scripts 项目代码,
# 各自有不同编码规范, 不纳入本仓 ruff 扫描 (checkwork / 日常 lint 均受益)
extend-exclude = [".trellis", ".codex"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]  # 行长由 line-length 控制, 不强制断行
