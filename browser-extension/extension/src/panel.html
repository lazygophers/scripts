<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="panelTitle">browse</title>
    <style>
      :root { color-scheme: dark light; }
      body {
        font: 13px/1.5 system-ui, sans-serif;
        margin: 0;
        padding: 14px 16px;
        min-width: 300px;
        background: #16181d;
        color: #e6e8ec;
      }
      h1 { font-size: 13px; margin: 0 0 4px; color: #9aa1ac; font-weight: 600; }
      p { margin: 0 0 12px; color: #9aa1ac; }
      ul { list-style: none; margin: 0; padding: 0; }
      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 5px 0;
        border-top: 1px solid #23262d;
      }
      .domain { font-family: ui-monospace, monospace; word-break: break-all; }
      button {
        font: inherit;
        padding: 2px 10px;
        border-radius: 5px;
        border: 1px solid #3a3f48;
        background: #23262d;
        color: inherit;
        cursor: pointer;
      }
      #cut { width: 100%; margin-bottom: 12px; border-color: #6b2b2b; background: #2b1c1c; }
      .log li { font-family: ui-monospace, monospace; justify-content: flex-start; }
      .ok { color: #4ade80; }
      .bad { color: #f87171; }
      .ms { color: #6b7280; margin-left: auto; }
    </style>
  </head>
  <body>
    <button id="cut" data-i18n="panelDisconnect">Disconnect now</button>

    <h1 data-i18n="panelRecent">Recent commands</h1>
    <p id="logStatus" data-i18n="panelLoading">loading…</p>
    <ul id="log" class="log"></ul>

    <h1 data-i18n="panelAllowed">Domains that skip confirmation</h1>
    <p id="status" data-i18n="panelLoading">loading…</p>
    <ul id="list"></ul>
    <script type="module" src="panel.js"></script>
  </body>
</html>
