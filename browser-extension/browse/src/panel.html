<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="panelTitle">browse</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="panel">
    <div class="stack">
      <button id="cut" class="btn destructive" data-i18n="panelDisconnect">Disconnect now</button>
      <button id="settings" class="btn" data-i18n="panelSettings">Settings</button>
    </div>

    <h2 data-i18n="panelBridge">Bridge service</h2>
    <p class="hint" id="bridgeStatus" data-i18n="panelLoading">loading…</p>
    <ul id="bridge" class="rows"></ul>

    <h2 data-i18n="panelRecent">Recent commands</h2>
    <p class="hint" id="logStatus" data-i18n="panelLoading">loading…</p>
    <div class="stack row">
      <input id="logFilter" class="filter" type="search" data-i18n-placeholder="panelFilter" />
      <button id="logCopy" class="btn" data-i18n="panelCopy">Copy</button>
    </div>
    <ul id="log" class="rows"></ul>

    <h2 data-i18n="panelServerLog">Bridge log</h2>
    <p class="hint" id="serverLogStatus" data-i18n="panelLoading">loading…</p>
    <ul id="serverLog" class="rows"></ul>

    <h2 data-i18n="panelAllowed" style="margin-top:18px">Domains that skip confirmation</h2>
    <p class="hint" id="status" data-i18n="panelLoading">loading…</p>
    <ul id="list" class="rows"></ul>
    <script type="module" src="panel.js"></script>
  </body>
</html>
