name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      # 9330 可能撞上开发者本机的真 bridge；CI 里只要随机端口
      BROWSE_BRIDGE_PORT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # 并行跑：串行 `unittest discover` 实测 838s，同一台机上并行 ~80s
      - name: Unit tests
        run: python3 tests/run.py

  extension:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [browse, viewer, shared]
    defaults:
      run:
        working-directory: browser-extension/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-extension/${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm test
      # shared 没有 tsconfig / typecheck script
      - run: npm run typecheck
        if: matrix.package != 'shared'

  # IDEA 插件（Kotlin）之前完全没进 CI，坏了没人知道
  idea-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Plugin tests
        working-directory: idea-plugins/lazy-git
        run: ./gradlew test --no-daemon
